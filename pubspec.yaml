name: spendly
description: "Simple expense tracker"


publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  sqflite: ^2.4.6
  path: ^1.9.1
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  fl_chart: ^1.3.1
  flutter_native_splash: ^2.4.8
  google_nav_bar: ^5.0.7
  flutter_launcher_icons: ^0.14.4
  flutter_localization: ^1.0.0
  get_storage: ^2.1.1
  iconsax: ^0.0.8
  google_fonts: 8.2.1
  gap: ^3.1.0
  uuid: ^4.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
flutter:

  uses-material-design: true
  assets:
    - assets/
    - assets/images/logo/

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#0F1F1B"

  image: assets/images/logo/splash.png
  image_dark: assets/images/logo/splash.png   # same logo, or a light variant if it's hard to see on dark

  android_gravity: center
  ios_content_mode: center
  fullscreen: false

  android_12:
    color: "#FFFFFF"
    color_dark: "#0F1F1B"
    image: assets/images/logo/splash_android12.png




























